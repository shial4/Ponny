name: Refresh data and deploy Pony

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    # Riot patches are infrequent, but this keeps the static snapshot fresh without
    # requiring a code push. Runtime also checks the official version endpoint.
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pony-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch newest League static data
        run: python scripts/fetch-latest-data.py

      - name: Show resolved data versions
        run: |
          python - <<'PY'
          import json
          with open("data/manifest.json", encoding="utf-8") as f:
              m = json.load(f)
          print("Fetched:", m.get("fetched_at"))
          print("Riot Data Dragon:", m.get("riot", {}).get("ddragon_version"))
          print("CommunityDragon:", m.get("communitydragon", {}).get("channel"))
          print("Refresh errors:", len(m.get("errors", [])))
          PY

      - name: Build static artifact
        run: |
          mkdir -p dist
          cp index.html 404.html site.webmanifest .nojekyll dist/
          cp -R assets data dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
