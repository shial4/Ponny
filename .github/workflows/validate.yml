name: Validate Pony

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate static project
        run: python scripts/validate-project.py

      - name: Validate recommendation model
        run: node tests/model.test.js

      - name: Validate UI/product invariants
        run: python tests/static.test.py
